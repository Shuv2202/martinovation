<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Blue Linear Gradient for Chevron Blades -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Dark Metallic Chrome Gradient for Chassis & Traces -->
    <linearGradient id="metallicDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Chrome Edge Highlight Gradient -->
    <linearGradient id="chromeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Industrial Gear Metallic Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="20%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Torus Orange to Yellow Gradient -->
    <linearGradient id="torusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Radial Glow for Torus Core -->
    <radialGradient id="torusInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0" />
    </radialGradient>

    <!-- Terminal Sphere 3D Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="25%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Bevel Lighting Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g id="martinovation-official-emblem" filter="url(#softShadow)">
    <!-- ==================== CIRCUIT BOARD TRACES (LEFT & RIGHT) ==================== -->
    <!-- Left Circuit 1 (Outer) -->
    <path
      d="M 60,305 L 50,305 L 50,185 L 75,160 L 75,52"
      fill="none"
      stroke="#0f172a"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 60,305 L 50,305 L 50,185 L 75,160 L 75,52"
      fill="none"
      stroke="url(#chromeHighlight)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 60,305 L 50,305 L 50,185 L 75,160 L 75,52"
      fill="none"
      stroke="#020617"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Left Node 1 -->
    <circle cx="75" cy="45" r="11" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="72" cy="42" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Left Circuit 2 (Middle) -->
    <path
      d="M 88,300 L 88,205 L 110,183 L 110,118"
      fill="none"
      stroke="#0f172a"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 88,300 L 88,205 L 110,183 L 110,118"
      fill="none"
      stroke="url(#chromeHighlight)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 88,300 L 88,205 L 110,183 L 110,118"
      fill="none"
      stroke="#020617"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Left Node 2 -->
    <circle cx="110" cy="112" r="9.5" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="108" cy="109" r="2.5" fill="#ffffff" opacity="0.7" />

    <!-- Left Circuit 3 (Inner) -->
    <path
      d="M 124,285 L 124,235 L 140,219 L 140,172"
      fill="none"
      stroke="#0f172a"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 124,285 L 124,235 L 140,219 L 140,172"
      fill="none"
      stroke="url(#chromeHighlight)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 124,285 L 124,235 L 140,219 L 140,172"
      fill="none"
      stroke="#020617"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Left Node 3 -->
    <circle cx="140" cy="168" r="8" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="138" cy="165" r="2" fill="#ffffff" opacity="0.7" />

    <!-- Right Circuit 1 (Outer) -->
    <path
      d="M 440,305 L 450,305 L 450,185 L 425,160 L 425,52"
      fill="none"
      stroke="#0f172a"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 440,305 L 450,305 L 450,185 L 425,160 L 425,52"
      fill="none"
      stroke="url(#chromeHighlight)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 440,305 L 450,305 L 450,185 L 425,160 L 425,52"
      fill="none"
      stroke="#020617"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Node 1 -->
    <circle cx="425" cy="45" r="11" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="422" cy="42" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Right Circuit 2 (Middle) -->
    <path
      d="M 412,300 L 412,205 L 390,183 L 390,118"
      fill="none"
      stroke="#0f172a"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 412,300 L 412,205 L 390,183 L 390,118"
      fill="none"
      stroke="url(#chromeHighlight)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 412,300 L 412,205 L 390,183 L 390,118"
      fill="none"
      stroke="#020617"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Node 2 -->
    <circle cx="390" cy="112" r="9.5" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="388" cy="109" r="2.5" fill="#ffffff" opacity="0.7" />

    <!-- Right Circuit 3 (Inner) -->
    <path
      d="M 376,285 L 376,235 L 360,219 L 360,172"
      fill="none"
      stroke="#0f172a"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 376,285 L 376,235 L 360,219 L 360,172"
      fill="none"
      stroke="url(#chromeHighlight)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 376,285 L 376,235 L 360,219 L 360,172"
      fill="none"
      stroke="#020617"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Node 3 -->
    <circle cx="360" cy="168" r="8" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="358" cy="165" r="2" fill="#ffffff" opacity="0.7" />

    <!-- ==================== OUTER CHROME CRADLE / BRACKET ==================== -->
    <path
      d="M 50,305 L 140,305 L 180,335 L 205,335 L 205,385 L 145,385 L 120,340 L 50,325 Z"
      fill="url(#metallicDark)"
      stroke="#475569"
      stroke-width="2"
    />
    <path
      d="M 450,305 L 360,305 L 320,335 L 295,335 L 295,385 L 355,385 L 380,340 L 450,325 Z"
      fill="url(#metallicDark)"
      stroke="#475569"
      stroke-width="2"
    />

    <!-- ==================== INDUSTRIAL GEAR (BOTTOM) ==================== -->
    <!-- Cogwheel teeth arc along the bottom -->
    <path
      d="
        M 125,365
        L 138,365 L 146,395 L 170,392 L 170,366
        L 182,374 L 185,410 L 208,416 L 214,388
        L 226,394 L 226,432 L 250,435 L 256,435 L 256,432 L 274,394
        L 286,388 L 292,416 L 315,410 L 318,374
        L 330,366 L 330,392 L 354,395 L 362,365
        L 375,365
        L 375,340
        L 335,340
        A 115 115 0 0 1 165,340
        L 125,340
        Z
      "
      fill="url(#gearGrad)"
      stroke="#64748b"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Individual Precision Cog Teeth Outline for Metallic Depth -->
    <g stroke="#334155" stroke-width="1.5" fill="none">
      <!-- Outer Rim Bevel -->
      <path d="M 146,395 L 170,392" stroke="#94a3b8" />
      <path d="M 185,410 L 208,416" stroke="#94a3b8" />
      <path d="M 226,432 L 274,432" stroke="#94a3b8" />
      <path d="M 292,416 L 315,410" stroke="#94a3b8" />
      <path d="M 330,392 L 354,395" stroke="#94a3b8" />
    </g>

    <!-- Gear Hub Circular Seat -->
    <circle cx="250" cy="355" r="78" fill="#0b111e" stroke="#1e293b" stroke-width="4" />
    <circle cx="250" cy="355" r="72" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,5" />

    <!-- ==================== CENTRAL POWER CORE (TORUS / RING) ==================== -->
    <!-- Golden Core Ambient Halo Glow -->
    <circle cx="250" cy="355" r="54" fill="url(#torusInnerGlow)" opacity="0.65" filter="url(#coreGlow)" />

    <!-- Outer Torus Ring -->
    <circle
      cx="250"
      cy="355"
      r="44"
      fill="url(#torusGrad)"
      stroke="#ea580c"
      stroke-width="3"
      filter="url(#coreGlow)"
    />
    <!-- Torus Specular Rim Highlight -->
    <ellipse cx="250" cy="346" rx="34" ry="12" fill="#fef08a" opacity="0.5" />

    <!-- Inner Torus Void / Hole -->
    <circle cx="250" cy="355" r="23" fill="#090d16" stroke="#c2410c" stroke-width="3.5" />
    <!-- Center Dark Core Depth Ring -->
    <circle cx="250" cy="355" r="16" fill="#030712" />

    <!-- Torus Vertical Antenna / Sensor Probe -->
    <rect x="247" y="278" width="6" height="34" fill="url(#metallicDark)" stroke="#475569" stroke-width="1" />
    <line x1="250" y1="278" x2="250" y2="312" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="250" cy="274" r="7" fill="url(#sphereGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="248.5" cy="272.5" r="2" fill="#ffffff" opacity="0.8" />

    <!-- ==================== THE FUTURISTIC "M" (CHEVRON & BLADES) ==================== -->
    <!-- Left Wing Outer Bracket -->
    <polygon
      points="172,175 140,188 140,320 188,320 200,280 172,275"
      fill="url(#metallicDark)"
      stroke="#334155"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- Left Wing Glowing Blade -->
    <polygon
      points="167,185 148,195 148,310 182,310 193,278 167,273"
      fill="url(#cyanBlueGrad)"
      stroke="#00f0ff"
      stroke-width="2"
      stroke-linejoin="round"
      filter="url(#coreGlow)"
    />
    <!-- Left Wing Specular Inset Angle -->
    <polyline
      points="148,195 167,185 193,278"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.5"
      opacity="0.6"
    />

    <!-- Right Wing Outer Bracket -->
    <polygon
      points="328,175 360,188 360,320 312,320 300,280 328,275"
      fill="url(#metallicDark)"
      stroke="#334155"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- Right Wing Glowing Blade -->
    <polygon
      points="333,185 352,195 352,310 318,310 307,278 333,273"
      fill="url(#cyanBlueGrad)"
      stroke="#00f0ff"
      stroke-width="2"
      stroke-linejoin="round"
      filter="url(#coreGlow)"
    />
    <!-- Right Wing Specular Inset Angle -->
    <polyline
      points="352,195 333,185 307,278"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.5"
      opacity="0.6"
    />

    <!-- ==================== CENTRAL V-CHEVRON (MAIN M APEX) ==================== -->
    <!-- Outer Heavy Metallic Bevel of Chevron -->
    <polygon
      points="
        135,62
        170,62
        250,182
        330,62
        365,62
        365,160
        322,175
        250,245
        178,175
        135,160
      "
      fill="url(#metallicDark)"
      stroke="#64748b"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Inner Glowing Chevron (V-Ribbon) -->
    <polygon
      points="
        146,75
        168,75
        250,195
        332,75
        354,75
        354,148
        316,164
        250,230
        184,164
        146,148
      "
      fill="url(#cyanBlueGrad)"
      stroke="#00f0ff"
      stroke-width="2.5"
      stroke-linejoin="round"
      filter="url(#coreGlow)"
    />

    <!-- Chevron Center Cut-out / Negative Relief (creating the double blade M shape) -->
    <polygon
      points="
        178,88
        250,192
        322,88
        338,98
        250,218
        162,98
      "
      fill="url(#metallicDark)"
      stroke="#0f172a"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Specular Blade Edge Highlights -->
    <polyline
      points="135,62 170,62 250,182 330,62 365,62"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.5"
      opacity="0.8"
    />
    <polyline
      points="178,175 250,245 322,175"
      fill="none"
      stroke="#38bdf8"
      stroke-width="2"
      opacity="0.9"
    />

    <!-- Central Apex Energy Node -->
    <circle cx="250" cy="245" r="4.5" fill="#ffffff" filter="url(#coreGlow)" />
  </g>
</svg>
